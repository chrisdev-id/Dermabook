# Situs dibangun dan dipublikasikan oleh Vercel (lihat vercel.json).
# Workflow ini memvalidasi konten setiap ada perubahan di main.
name: Validasi main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validasi-main
  cancel-in-progress: true

jobs:
  validasi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Cek referensi ke PubMed
        run: npm run verify:references
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}

      - name: Cek rujukan mesh model 3D
        run: npm run verify:meshes

      - name: Cek nomor 510(k) ke openFDA
        run: npm run verify:devices
        env:
          OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}

      - name: Cek tipe
        run: npm run check

      - name: Build situs
        run: npm run build

      - name: Cek tautan internal
        run: npm run check:links
