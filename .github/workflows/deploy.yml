name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Cek referensi ke PubMed
        run: npm run verify:references
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}

      - name: Cek rujukan mesh model 3D
        run: npm run verify:meshes

      - name: Cek nomor 510(k) ke openFDA
        run: npm run verify:devices
        env:
          OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}

      - name: Build situs
        run: npm run build

      # Isi secret FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, dan FTP_SERVER_DIR
      # (mis. "public_html/") di Settings → Secrets and variables → Actions.
      - name: Unggah ke hosting
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}

      - name: Lewati unggah (secret belum diatur)
        if: env.FTP_SERVER == ''
        run: echo "Secret FTP_SERVER belum diatur; build berhasil tetapi tidak diunggah."
